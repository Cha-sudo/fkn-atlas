[project]
name = "fkn-atlas"
version = "0.4.0"
description = "Resumable provenance-first reconnaissance pilot for Wiki FKN"
requires-python = ">=3.11"

[project.optional-dependencies]
documents = ["pypdf>=5,<7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
