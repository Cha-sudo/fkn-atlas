[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fkn-atlas"
version = "1.6.0"
description = "Evidence-first personal educational library from FCS Wiki"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4==4.15.0", "httpx==0.28.1", "pypdf==7.1.0", "fonttools==4.68.0"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
visual = ["PyMuPDF==1.26.7"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["learning/*.html", "learning/*.css", "learning/*.js", "learning/seminars.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
